<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse furniture and decoration products for your home.">
    <title>Our Products | AI Decor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="./first.js" defer></script>
</head>
<body>
    <header class="navbar">
        <a class="logo" href="../home/index.html" aria-label="AI Decor home">AI Decor</a>
        <a class="home-link" href="../home/index.html">Back to home</a>
    </header>

    <main class="page-shell">
        <section class="page-heading" aria-labelledby="products-title">
            <p class="eyebrow">Furniture and decor</p>
            <h1 id="products-title">Our Products</h1>
            <p class="page-subtitle">Find pieces that make every room feel complete.</p>
        </section>

        <section class="product-directory" aria-labelledby="catalog-title">
            <div class="directory-heading">
                <div>
                    <p class="section-label">Explore the collection</p>
                    <h2 id="catalog-title">Furniture &amp; Decoration</h2>
                </div>
                <span class="product-count" id="product-count">0 products</span>
            </div>

            <div class="catalog-toolbar">
                <div class="category-filter" id="category-filter" aria-label="Filter furniture by category">
                    <button class="category-button active" type="button" data-category="all">All</button>
                    <button class="category-button" type="button" data-category="fan">Fan</button>
                    <button class="category-button" type="button" data-category="bed">Bed</button>
                    <button class="category-button" type="button" data-category="sofa">Sofa</button>
                    <button class="category-button" type="button" data-category="table">Table</button>
                    <button class="category-button" type="button" data-category="chair">Chair</button>
                    <button class="category-button" type="button" data-category="vase">Vase</button>
                    <button class="category-button" type="button" data-category="chandelier">Chandelier</button>
                </div>

                <div class="sort-bar">
                    <label for="sort-furniture">Sort by</label>
                    <select id="sort-furniture" name="sort">
                        <option value="featured">Featured</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="rating">Customer Rating</option>
                    </select>
                </div>
            </div>

            <div class="furniture-grid" id="furniture" aria-live="polite">

            </div>
        </section>
    </main>
</body>
</html>
